plugins {
    id "com.android.application"
    // v2.9.156: Firebase — push notification için (version root build.gradle'da)
    id "com.google.gms.google-services"
}

android {
    namespace "com.touchline.manager"
    compileSdk 35
    defaultConfig {
        applicationId "com.touchline.manager"
        minSdk 24
        targetSdk 35
        versionCode 1570
        versionName "2.9.157"
    }
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
    aaptOptions {
        // v2.9.16: KRİTİK — _* pattern'i KULLANMA!
        // AAPT varsayılan davranışı _ ile başlayan dosyaları atlar (_next/ dahil)
        // Biz sadece gerçekten gereksiz dosyaları atla, _next/ KESİNLİKLE dahil et
        // .svn, .git, .ds_store vb. gizli dosyaları atla ama _next/ ve tüm JS'i tut
        ignoreAssetsPattern ".svn:.git:.ds_store:*.scc:CVS:thumbs.db:picasa.ini:*.bak"
    }

    // ════════════════════════════════════════════════════════════════════════════
    // v2.9.146: Release signing config — hardcoded DEĞİL, env var/local.properties
    // ════════════════════════════════════════════════════════════════════════════
    // Kök neden (kullanıcı şikayeti): v2.9.13'ten beri release build signingConfig
    // signingConfigs.debug kullanıyordu → APK debug keystore ile imzalanıyordu →
    // her makina aynı APK'yı farklı imza ile üretiyordu → GitHub release APK'sını
    // telefona kurarken "imza uyuşmazlığı" hatası.
    //
    // Çözüm: signingConfigs.release bloğu eklendi. Credentials env var'dan okunur,
    // yoksa local.properties'ten (o dosya .gitignore'da). İkisi de yoksa uyarı verir
    // ve debug fallback'e döner (geliştirme için).
    signingConfigs {
        release {
            // Öncelik sırası: env var → local.properties → yok (debug fallback)
            // v2.9.146 NOT: keyAlias/keyPassword hem property hem method olduğu için
            // Groovy bunları method call olarak yorumluyor. String değişkeni her zaman
            // parantezle çağırmalı: keyAlias(value), keyPassword(value).
            def keystorePath = System.getenv("TOUCHLINE_KEYSTORE_PATH")
            def keystorePassword = System.getenv("TOUCHLINE_KEYSTORE_PASSWORD")
            def keyAliasValue = System.getenv("TOUCHLINE_KEY_ALIAS")
            def keyPasswordValue = System.getenv("TOUCHLINE_KEY_PASSWORD")

            // local.properties fallback (CI dışı lokal build'ler için)
            if (keystorePath == null) {
                def localProps = new Properties()
                def localPropsFile = rootProject.file("local.properties")
                if (localPropsFile.exists()) {
                    localProps.load(new FileInputStream(localPropsFile))
                    keystorePath = localProps.getProperty("touchline.keystore.path")
                    keystorePassword = localProps.getProperty("touchline.keystore.password")
                    keyAliasValue = localProps.getProperty("touchline.key.alias")
                    keyPasswordValue = localProps.getProperty("touchline.key.password")
                }
            }

            // Sadece tüm credential'lar varsa release config'i etkinleştir
            if (keystorePath != null && keystorePassword != null && keyAliasValue != null && keyPasswordValue != null) {
                // rootProject.file() ile root dizine (android-app/) göre resolve eder.
                // app/ dizinine göre DEĞİL — yoksa "/home/.../android-app/app/keystore.jks" arar.
                def keystoreFile = rootProject.file(keystorePath)
                println "🔐 Release signing: keystore=${keystoreFile.absolutePath}, alias=${keyAliasValue}"
                storeFile keystoreFile
                storePassword(keystorePassword)
                keyAlias(keyAliasValue)
                keyPassword(keyPasswordValue)
            } else {
                println "⚠️  Release signing credentials bulunamadı (env var veya local.properties)."
                println "    Şablon için: android-app/gradle.properties.example"
                println "    Debug keystore ile imzalanacak — production release için KULLANMAYIN."
                println "    Lokal test için sorun değil."
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // v2.9.146: signingConfigs.debug → signingConfigs.release
            // Eğer credentials yoksa (yukarıda println uyarısı verir), signingConfigs.release
            // boş kalır → gradle otomatik debug keystore'a fallback yapar. Eğer credentials
            // varsa production release keystore ile imzalanır.
            signingConfig signingConfigs.release
            // Assets sıkıştırma kapalı — web dosyaları bozulmasın
            crunchPngs false
            // v2.9.13 MADDE 5: debuggable KESİNLİKLE false
            debuggable false
        }
    }
}

// ════════════════════════════════════════════════════════════════════════════
// v2.9.13 MADDE 3: Production APK güvenlik doğrulama task'ı
// ════════════════════════════════════════════════════════════════════════════
// Release APK build edildikten sonra APK'yı unzip edip assets/web içinde
// "supabase-test", "apk-indir", "apk-data" string'leri arar.
// Bulursa build'i FAIL ettirir — insan hatasıyla tekrar sızması imkansız.
task verifyProductionApk {
    doLast {
        def apkDir = file("build/outputs/apk/release")
        if (!apkDir.exists()) {
            println "⚠️ APK dizini bulunamadı, doğrulama atlanıyor"
            return
        }
        def apkFile = apkDir.listFiles()?.find { it.name.endsWith(".apk") }
        if (!apkFile) {
            println "⚠️ APK dosyası bulunamadı, doğrulama atlanıyor"
            return
        }

        println "═══════════════════════════════════════════════════"
        println "v2.9.13 MADDE 3: Production APK güvenlik doğrulaması"
        println "APK: ${apkFile.name} (${apkFile.length() / 1024}KB)"
        println "═══════════════════════════════════════════════════"

        // Geçici dizine unzip et
        def tmpDir = File.createTempDir("apk_verify")
        tmpDir.deleteOnExit()
        ant.unzip(src: apkFile, dest: tmpDir)

        def assetsWebDir = new File(tmpDir, "assets/web")
        def violations = []

        if (assetsWebDir.exists()) {
            // Yasaklı string'ler ara
            def forbiddenStrings = ["supabase-test", "apk-indir", "apk-data"]
            assetsWebDir.eachFileRecurse { file ->
                if (file.isFile()) {
                    def content = file.text
                    for (String forbidden : forbiddenStrings) {
                        if (content.contains(forbidden)) {
                            violations.add("  ❌ ${file.path}: '${forbidden}' bulundu!")
                        }
                    }
                }
            }
        } else {
            violations.add("  ❌ assets/web dizini bulunamadı!")
        }

        // Temizlik
        tmpDir.deleteDir()

        if (violations.isEmpty()) {
            println "✅ Doğrulama başarılı — yasaklı içerik bulunamadı"
        } else {
            println "❌ Doğrulama BAŞARISIZ — yasaklı içerik tespit edildi:"
            violations.each { println it }
            throw new GradleException("Production APK güvenlik doğrulaması başarısız!")
        }
    }
}

// Release build sonrası otomatik doğrulama
afterEvaluate {
    // assembleRelease.finalizedBy verifyProductionApk
}

// =============================================================================
// v2.9.46 Görev 2: Google Play Billing dependency
// =============================================================================
// BillingClient — kredi paketi satın alma için
// https://developer.android.com/google/play/billing/integrate
dependencies {
    implementation 'com.android.billingclient:billing-ktx:6.1.0'
    // v2.9.156: Firebase — push notification için
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
}
